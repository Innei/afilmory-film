<canvas id="c"></canvas>
<script src="core.js"></script><script src="studio-ui.js"></script><script src="studio.js"></script><script src="cels.js"></script><script src="materials.js"></script>

<script>
'use strict';
/* Brief
Subject: AF, the camera from the Afilmory logo, walks a roll of film that is the repo's history.
  One continuous shot, AF only moves right, one frame per commit. OUTLINE.md holds the whole route.
Format: 16:9, 1920x1080, 24 fps preview, 60 fps delivery. ?lang=zh for the Chinese cut.
*/
const SCENES = [
  ['page', 0, T1.appear], ['hello', T1.appear, T1.canister], ['canister', T1.canister, T1.shoot], ['day-one', T1.shoot, T1.walk6],
  ['to-jun-6', T1.walk6, T1.print], ['webgl-viewer', T1.print, T1.carry], ['exif-live', T1.carry, T1.tray], ['fixer', T1.tray, T1.inked],
  ['v0.1.0', T1.inked, T1.storage], ['storage', T1.storage, 33.6], ['map', 33.6, 40.2], ['hdr', 40.2, 44.4], ['stumble', 44.4, 49.6],
  ['search', 49.6, 53.6], ['static-site', 53.6, 58.6], ['server', 58.6, 65.6], ['afilmory.art', 65.6, 70.8], ['docker', 70.8, 75.2],
  ['november', 75.2, 79], ['winter', 79, 86.2], ['pocket', 86.2, 90], ['busiest-day', 90, 95], ['native-swift', 95, 101.6],
  ['phone-features', 101.6, 108.4], ['colour', 108.4, JOURNEY_END],
];
const ENDING = [['contact-sheet', JOURNEY_END, FIN.sign], ['signature', FIN.sign, FIN.card], ['closing-card', FIN.card, FIN.end]];
const TIMELINE = [...SCENES.map(([name, a, b]) => ({name, dur: b - a, fn: (c, tau) => journey(c, a + tau)})), ...ENDING.map(([name, a, b]) => ({name, dur: b - a, fn: (c, tau) => finale(c, a + tau)}))];
const qfps = +new URLSearchParams(location.search).get('fps');
defineFilm({palette: {...PALETTES.pencilMinimal, paper: AFC.paper}, format: {ar: '16:9', width: 1920}, fps: [12, 24, 60].includes(qfps) ? qfps : 24, timeline: TIMELINE, score: afScore});
</script>
